<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Surge Apparel Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0A">
<meta name="robots" content="noindex">
<link rel="icon" href="/shop/logos/Surge_SP_Monogram_gold.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;500;600;700;800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
<script src="/shop/render.js"></script>
<style>
:root{--bg:#0A0A0A;--card:#141416;--card2:#1C1C1F;--line:rgba(197,176,113,.2);--line2:rgba(255,255,255,.09);--g1:#E4D39E;--g2:#C5B071;--tx:#F2EFE6;--mu:#A39D8F;--ok:#7FBF7A;--bad:#E9A49A;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 Montserrat,system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:10;background:rgba(10,10,10,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line2)}
.hb{display:flex;align-items:center;justify-content:space-between;gap:12px;height:60px}
.ttl{font:400 22px Anton,Impact,sans-serif;letter-spacing:.04em}.ttl span{color:var(--g2)}
.lnk{color:var(--g1);font-size:13px;font-weight:700;text-decoration:none;letter-spacing:.06em}
.tabs{display:flex;gap:6px;padding:0 0 10px;overflow-x:auto}
.tabs button{flex:none;border:1px solid var(--line2);background:none;border-radius:999px;padding:7px 14px;font-weight:700;font-size:13px;color:var(--mu)}
.tabs button.on{background:var(--g2);border-color:var(--g2);color:#0A0A0A}
main{padding:20px 0 80px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
h2{margin:0;font:400 30px Anton,Impact,sans-serif;letter-spacing:.03em}
.btn{height:46px;border:0;border-radius:10px;background:linear-gradient(180deg,var(--g1),var(--g2));color:#0A0A0A;font-weight:800;letter-spacing:.1em;font-size:13px;padding:0 18px}
.btn:disabled{opacity:.5}
.btn2{height:42px;border:1px solid var(--line);border-radius:10px;background:none;font-weight:700;font-size:13px;padding:0 14px}
.btn3{height:36px;border:1px solid var(--line2);border-radius:8px;background:var(--card2);font-weight:600;font-size:13px;padding:0 12px}
.danger{color:var(--bad);border-color:rgba(233,164,154,.4)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.pc{background:var(--card);border:1px solid var(--line2);border-radius:10px;padding:0;text-align:left;overflow:hidden}
.pc .im{aspect-ratio:1/1;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#202023,#141416 70%)}
.pc .im svg,.pc .im img{width:78%;height:78%;object-fit:contain}
.pc .m{padding:12px 14px;display:grid;gap:4px}
.pc .n{font:400 19px Anton,Impact,sans-serif;letter-spacing:.02em}
.pill{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.12em;padding:3px 8px;border-radius:4px}
.live{background:rgba(127,191,122,.15);color:var(--ok)}.draft{background:rgba(255,255,255,.08);color:var(--mu)}.so{background:rgba(233,164,154,.14);color:var(--bad)}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.empty{color:var(--mu);padding:30px 0}
/* editor */
.ed{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:22px;align-items:start}
.pvw{position:sticky;top:120px;background:var(--card);border:1px solid var(--line2);border-radius:12px;padding:14px}
.pvs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pvs>div{background:radial-gradient(circle at 50% 40%,#232327,#141416 70%);border-radius:8px;aspect-ratio:1/1;display:grid;place-items:center;position:relative}
.pvs svg{width:90%;height:90%}
.pvs span{position:absolute;top:8px;left:10px;font-size:10px;font-weight:800;letter-spacing:.2em;color:var(--mu)}
.pvc{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;justify-content:center}
.pvc button{width:28px;height:28px;border-radius:50%;border:2px solid transparent;outline:1px solid rgba(255,255,255,.25);outline-offset:-1px}
.pvc button.on{border-color:var(--g2)}
.sec{background:var(--card);border:1px solid var(--line2);border-radius:12px;padding:16px;margin-bottom:14px}
.sec h3{margin:0 0 12px;font-size:12px;font-weight:800;letter-spacing:.2em;color:var(--g2)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{border:1px solid var(--line2);background:var(--card2);border-radius:8px;padding:9px 12px;font-weight:700;font-size:13px}
.chips button.on{border-color:var(--g2);background:rgba(197,176,113,.13);color:var(--g1)}
.sws{display:flex;gap:10px;flex-wrap:wrap}
.sws button{display:flex;align-items:center;gap:8px;border:1px solid var(--line2);background:var(--card2);border-radius:999px;padding:5px 12px 5px 5px;font-size:13px;font-weight:600}
.sws button i{width:22px;height:22px;border-radius:50%;border:1px solid rgba(255,255,255,.3);display:block}
.sws button.on{border-color:var(--g2);color:var(--g1)}
.lg{border:1px solid var(--line2);border-radius:10px;padding:12px;display:grid;gap:10px;margin-bottom:10px;background:var(--card2)}
.lg .top{display:flex;gap:10px;align-items:center}
.lg .top img{width:46px;height:46px;object-fit:contain;background:#0d0d0e;border-radius:6px;padding:4px}
.f{display:grid;gap:6px}
.f label,.lbl{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--mu)}
input[type=text],input[type=number],input[type=email],input[type=password],select,textarea{width:100%;background:#0d0d0e;border:1px solid var(--line2);border-radius:8px;padding:11px 12px;font-size:15px}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--g2);outline-offset:0}
input[type=range]{width:100%;accent-color:var(--g2)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--card2);padding:8px 12px;font-size:12px;font-weight:700}
.seg button.on{background:var(--g2);color:#0A0A0A}
.seg button:disabled{opacity:.4}
.tog{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line2)}
.tog:last-child{border-bottom:0}
.sw2{position:relative;width:48px;height:28px;flex:none}
.sw2 input{opacity:0;width:100%;height:100%;margin:0;position:absolute;cursor:pointer}
.sw2 span{position:absolute;inset:0;border-radius:14px;background:#333;pointer-events:none;transition:.2s}
.sw2 span:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.sw2 input:checked+span{background:var(--ok)}.sw2 input:checked+span:after{left:23px}
.ph{display:flex;gap:8px;flex-wrap:wrap}
.ph div{position:relative;width:72px;height:72px;border-radius:8px;overflow:hidden;background:#0d0d0e}
.ph img{width:100%;height:100%;object-fit:cover}
.ph button{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.7);font-size:13px;line-height:1}
.acts{display:flex;gap:10px;flex-wrap:wrap;position:sticky;bottom:0;background:linear-gradient(180deg,transparent,var(--bg) 30%);padding:18px 0 calc(10px + env(safe-area-inset-bottom))}
.msg{font-size:13px;min-height:18px}.msg.ok{color:var(--ok)}.msg.err{color:var(--bad)}
/* orders */
.oc{background:var(--card);border:1px solid var(--line2);border-radius:12px;padding:16px;margin-bottom:12px;display:grid;gap:10px}
.oc .h{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.oc .nm{font-weight:800;font-size:16px}
.oc .sub{color:var(--mu);font-size:13px}
.oc ul{margin:0;padding-left:18px}
.addr{background:#0d0d0e;border-radius:8px;padding:10px 12px;font-size:14px;white-space:pre-line}
/* gate */
#gate{display:none;min-height:100vh;min-height:100dvh;align-items:center;justify-content:center;padding:24px 16px}
html.locked #gate{display:flex}html.locked #app{display:none}
.gbox{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:30px 22px;text-align:center;display:grid;gap:10px}
.gbox img{width:170px;margin:0 auto 6px}
.gbox p{color:var(--mu);font-size:14px;margin:0 0 8px}
.gbox .msg{color:var(--bad)}
@media (max-width:820px){.ed{grid-template-columns:1fr}.pvw{position:static}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
:focus-visible{outline:2px solid var(--g1);outline-offset:2px}
</style>
<script>document.documentElement.classList.add('locked')</script>
</head>
<body>
<div id="gate"><form class="gbox" id="gform"><img src="/shop/logos/Surge_Flag_Wordmark_gold.png" alt="Surge Partners"><p id="gtxt">Checking access…</p>
<div id="glog" hidden style="display:grid;gap:10px"><input id="gemail" type="email" autocomplete="username" placeholder="Agent Space email" aria-label="Email" required><input id="gpass" type="password" autocomplete="current-password" placeholder="Password" aria-label="Password" required><button class="btn" id="gbtn">SIGN IN</button></div>
<div class="msg" id="gerr" role="alert"></div></form></div>

<div id="app">
<header><div class="wrap"><div class="hb"><div class="ttl">SURGE <span>APPAREL</span> · ADMIN</div><a class="lnk" href="/shop/" target="_blank" rel="noopener">VIEW STORE ↗</a></div>
<nav class="tabs" id="tabs"><button data-t="products" class="on">Products</button><button data-t="orders">Orders</button><button data-t="settings">Settings</button></nav></div></header>
<main class="wrap" id="view"></main>
</div>

<script>
(function(){
var SUPA_URL='https://szdzbycppkavfwuzlljh.supabase.co',SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN6ZHpieWNwcGthdmZ3dXpsbGpoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk1ODIxNzgsImV4cCI6MjA5NTE1ODE3OH0.Jw21eHChMDHlskSs2PegmBXLYNIQkjl8GByOIApadhA';
var R=window.SurgeRender,$=function(id){return document.getElementById(id)},sb=null,tab='products',P=[],O=[],S=null,E=null,pvColor=null,ofilter='paid',customLogos=[];
var PRESETS=[['Black','#141414'],['White','#F4F2EC'],['Charcoal','#2E2E30'],['Heather Grey','#8D8D8F'],['Navy','#1D2433'],['Forest','#1F2D24'],['Sand','#CBBE9C'],['Maroon','#4A1F25'],['Light Blue','#A9C4DD']];
var ALL_SIZES=['XS','S','M','L','XL','2XL','3XL','4XL','One Size'];
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function money(c){return '$'+((c||0)/100).toFixed(2)}
function cents(v){var n=Math.round(parseFloat(String(v).replace(/[^0-9.]/g,''))*100);return isNaN(n)?0:n}
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){}}

/* ---------- auth ---------- */
async function gateCheck(session){
 ls('surge_access_token',session.access_token);ls('surge_refresh_token',session.refresh_token);
 var r=await sb.from('profiles').select('role,blocked').eq('id',session.user.id).maybeSingle();
 if(r.data&&!r.data.blocked&&(r.data.role==='owner'||r.data.role==='admin')){document.documentElement.classList.remove('locked');boot();return}
 $('gtxt').textContent='This page is for the store owner.';$('glog').hidden=false;$('gerr').textContent='That account does not have store access.';
}
async function start(){
 if(!window.supabase){$('gtxt').textContent='Could not load. Refresh to try again.';return}
 sb=window.supabase.createClient(SUPA_URL,SUPA_KEY);
 try{var at=ls('surge_access_token'),rt=ls('surge_refresh_token');if(at&&rt){try{await sb.auth.setSession({access_token:at,refresh_token:rt})}catch(e){}}
  var s=(await sb.auth.getSession()).data.session;if(s){await gateCheck(s);return}}catch(e){}
 $('gtxt').textContent='Sign in with your Agent Space account.';$('glog').hidden=false;
}
$('gform').addEventListener('submit',async function(e){e.preventDefault();$('gbtn').disabled=true;$('gerr').textContent='';
 var r=await sb.auth.signInWithPassword({email:$('gemail').value.trim(),password:$('gpass').value});
 if(r.error)$('gerr').textContent=/invalid/i.test(r.error.message)?'Wrong email or password.':r.error.message;else await gateCheck(r.data.session);
 $('gbtn').disabled=false});

/* ---------- shell ---------- */
$('tabs').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;tab=b.dataset.t;E=null;
 [].forEach.call($('tabs').children,function(x){x.classList.toggle('on',x===b)});draw()});
async function boot(){await Promise.all([loadP(),loadS(),loadLogos()]);draw();loadO().then(function(){if(tab==='orders')draw()})}
async function loadP(){var r=await sb.from('store_products').select('*').order('sort').order('created_at',{ascending:false});P=r.data||[]}
async function loadO(){var r=await sb.from('store_orders').select('*').order('created_at',{ascending:false}).limit(300);O=r.data||[];var n=O.filter(function(o){return o.status==='paid'}).length;$('tabs').children[1].textContent='Orders'+(n?' ('+n+')':'')}
async function loadS(){var r=await sb.from('store_settings').select('*').eq('id',1).maybeSingle();S=r.data||{shipping_cents:0,free_ship_over_cents:0}}
async function loadLogos(){try{var r=await sb.storage.from('store').list('logos',{limit:100,sortBy:{column:'created_at',order:'desc'}});customLogos=(r.data||[]).filter(function(f){return f.name&&f.name.indexOf('.')>0}).map(function(f){return sb.storage.from('store').getPublicUrl('logos/'+f.name).data.publicUrl})}catch(e){customLogos=[]}}
function draw(){if(E)return drawEditor();if(tab==='products')drawProducts();else if(tab==='orders')drawOrders();else drawSettings()}

/* ---------- products ---------- */
function thumb(p){var c=(p.colors||[])[0]||{hex:'#141414'};return p.photos&&p.photos[0]?'<img src="'+esc(p.photos[0])+'" alt="">':R.render(p.blank,c.hex,'front',p.design)}
function drawProducts(){
 $('view').innerHTML='<div class="bar"><h2>Products</h2><button class="btn" id="newp">+ NEW PRODUCT</button></div>'+
 (P.length?'<div class="grid">'+P.map(function(p,i){return '<button class="pc" data-i="'+i+'"><div class="im">'+thumb(p)+'</div><div class="m"><div class="n">'+esc(p.name)+'</div><div class="row"><span>'+money(p.price_cents)+'</span><span>'+(p.sold_out?'<span class="pill so">SOLD OUT</span> ':'')+'<span class="pill '+(p.active?'live':'draft')+'">'+(p.active?'LIVE':'DRAFT')+'</span></span></div></div></button>'}).join('')+'</div>'
 :'<p class="empty">No products yet. Tap New Product to build your first piece.</p>');
 $('newp').onclick=function(){edit(null)};
 [].forEach.call(document.querySelectorAll('.pc'),function(b){b.onclick=function(){edit(P[+b.dataset.i])}});
}
function edit(p,copy){
 var d=p?JSON.parse(JSON.stringify(p)):{name:'',description:'',blank:'polo',colors:[{name:'Black',hex:'#141414'}],sizes:R.BLANKS.polo.sizes.slice(),price_cents:0,upcharge_cents:0,design:{logos:[{logo:'B',ink:'gold',place:'lchest',scale:1,dy:0}]},photos:[],active:false,sold_out:false};
 if(copy){delete d.id;d.name+=' (copy)';d.active=false}
 d.design=d.design&&d.design.logos?d.design:{logos:[]};E=d;pvColor=(d.colors[0]||{}).hex;scrollTo(0,0);draw();
}
function setBlank(b){var B=R.BLANKS[b];E.blank=b;E.sizes=B.sizes.slice();
 var places=Object.keys(B.places);E.design.logos.forEach(function(l){if(!B.places[l.place])l.place=places[0]})}
function placeOpts(sel){return Object.keys(R.BLANKS[E.blank].places).map(function(k){return '<option value="'+k+'"'+(k===sel?' selected':'')+'>'+R.PLACE_LABEL[k]+'</option>'}).join('')}
function logoOpts(sel){var o=Object.keys(R.LOGOS).map(function(k){return '<option value="'+k+'"'+(k===sel?' selected':'')+'>'+R.LOGOS[k]+'</option>'}).join('');
 o+=customLogos.map(function(u,i){return '<option value="'+esc(u)+'"'+(u===sel?' selected':'')+'>Uploaded logo '+(customLogos.length-i)+'</option>'}).join('');
 if(sel&&!R.LOGOS[sel]&&customLogos.indexOf(sel)<0)o+='<option value="'+esc(sel)+'" selected>Uploaded logo</option>';
 return o+'<option value="__up">+ Upload a logo (PNG)…</option>'}
function drawPreview(){var hex=pvColor||((E.colors[0]||{}).hex)||'#141414';
 var B=R.BLANKS[E.blank];var v=['front','back'].filter(function(x){return B[x]});
 $('pvs').innerHTML=v.map(function(x){return '<div><span>'+x.toUpperCase()+'</span>'+R.render(E.blank,hex,x,E.design)+'</div>'}).join('');
 $('pvc').innerHTML=E.colors.map(function(c){return '<button data-hex="'+esc(c.hex)+'" class="'+(c.hex===hex?'on':'')+'" style="background:'+esc(c.hex)+'" aria-label="Preview '+esc(c.name)+'" title="'+esc(c.name)+'"></button>'}).join('');
}
function drawEditor(){
 var B=R.BLANKS[E.blank];
 $('view').innerHTML='<div class="bar"><h2>'+(E.id?'Edit product':'New product')+'</h2><button class="btn2" id="back">← All products</button></div>'+
 '<div class="ed"><div class="pvw"><div class="pvs" id="pvs"></div><div class="pvc" id="pvc"></div></div><div>'+
 '<div class="sec"><h3>1 · BLANK</h3><div class="chips" id="blanks">'+Object.keys(R.BLANKS).map(function(k){return '<button data-b="'+k+'" class="'+(k===E.blank?'on':'')+'">'+R.BLANKS[k].label+'</button>'}).join('')+'</div></div>'+
 '<div class="sec"><h3>2 · COLORS</h3><div class="sws" id="sws">'+PRESETS.concat(E.colors.filter(function(c){return !PRESETS.some(function(p){return p[1].toLowerCase()===c.hex.toLowerCase()})}).map(function(c){return[c.name,c.hex]})).map(function(p){var on=E.colors.some(function(c){return c.hex.toLowerCase()===p[1].toLowerCase()});return '<button data-n="'+esc(p[0])+'" data-h="'+p[1]+'" class="'+(on?'on':'')+'" aria-pressed="'+on+'"><i style="background:'+p[1]+'"></i>'+esc(p[0])+'</button>'}).join('')+
 '</div><div class="two" style="margin-top:12px;grid-template-columns:60px 1fr auto"><input type="color" id="cc" value="#3a5a40" aria-label="Custom color" style="height:44px;padding:2px;background:#0d0d0e;border:1px solid var(--line2);border-radius:8px;width:60px"><input type="text" id="cn" placeholder="Custom color name"><button class="btn3" id="cadd">Add</button></div></div>'+
 '<div class="sec"><h3>3 · LOGOS</h3><div id="lgs">'+E.design.logos.map(function(l,i){var custom=!R.LOGOS[l.logo];return '<div class="lg" data-i="'+i+'"><div class="top"><img src="'+esc(R.logoSrc(l))+'" alt=""><select class="lsel" aria-label="Logo">'+logoOpts(l.logo)+'</select><button class="btn3 danger lrm" aria-label="Remove logo">✕</button></div>'+
  '<div class="two"><div class="f"><label>Placement</label><select class="lpl">'+placeOpts(l.place)+'</select></div><div class="f"><label>Thread / ink</label><div class="seg lin">'+['gold','white','black'].map(function(k){return '<button data-k="'+k+'" class="'+(l.ink===k?'on':'')+'" '+(custom?'disabled':'')+'>'+k[0].toUpperCase()+k.slice(1)+'</button>'}).join('')+'</div></div></div>'+
  '<div class="two"><div class="f"><label>Size <b class="sv">'+Math.round((l.scale||1)*100)+'%</b></label><input type="range" class="lsc" min="40" max="170" value="'+Math.round((l.scale||1)*100)+'"></div><div class="f"><label>Move up / down</label><input type="range" class="ldy" min="-50" max="50" value="'+(l.dy||0)+'"></div></div></div>'}).join('')+
 '</div><button class="btn3" id="ladd">+ Add another logo spot</button><input type="file" id="lfile" accept="image/png,image/svg+xml,image/webp" hidden></div>'+
 '<div class="sec"><h3>4 · DETAILS</h3><div style="display:grid;gap:12px"><div class="f"><label for="pn">Product name</label><input type="text" id="pn" value="'+esc(E.name)+'" placeholder="Tour Polo"></div>'+
 '<div class="f"><label for="pd">Description</label><textarea id="pd" placeholder="Performance polo with the SP monogram on the chest.">'+esc(E.description)+'</textarea></div>'+
 '<div class="two"><div class="f"><label for="pp">Price ($)</label><input type="number" id="pp" inputmode="decimal" min="0" step="0.01" value="'+(E.price_cents?(E.price_cents/100).toFixed(2):'')+'" placeholder="55.00"></div><div class="f"><label for="pu">2XL+ adds ($)</label><input type="number" id="pu" inputmode="decimal" min="0" step="0.01" value="'+(E.upcharge_cents?(E.upcharge_cents/100).toFixed(2):'')+'" placeholder="0"></div></div>'+
 '<div class="f"><label>Sizes</label><div class="chips" id="szs">'+ALL_SIZES.map(function(s){return '<button data-s="'+s+'" class="'+(E.sizes.indexOf(s)>=0?'on':'')+'">'+s+'</button>'}).join('')+'</div></div></div></div>'+
 '<div class="sec"><h3>5 · REAL PHOTOS <span style="color:var(--mu);letter-spacing:.04em;font-weight:600">(optional, shown after the mockup)</span></h3><div class="ph" id="phs">'+E.photos.map(function(u,i){return '<div><img src="'+esc(u)+'" alt=""><button data-i="'+i+'" aria-label="Remove photo">✕</button></div>'}).join('')+'</div><button class="btn3" id="padd" style="margin-top:10px">+ Add photos</button><input type="file" id="pfile" accept="image/*" multiple hidden></div>'+
 '<div class="sec"><h3>6 · STATUS</h3><div class="tog"><div><b>Live on the store</b><div class="lbl" style="letter-spacing:0">Off = saved as a draft only you can see</div></div><label class="sw2"><input type="checkbox" id="pa" '+(E.active?'checked':'')+'><span></span></label></div><div class="tog"><div><b>Sold out</b></div><label class="sw2"><input type="checkbox" id="pso" '+(E.sold_out?'checked':'')+'><span></span></label></div></div>'+
 '<div class="acts"><button class="btn" id="psave">SAVE PRODUCT</button>'+(E.id?'<button class="btn2" id="pdup">Duplicate</button><button class="btn2 danger" id="pdel">Delete</button>':'')+'<div class="msg" id="pmsg" style="flex-basis:100%"></div></div>'+
 '</div></div>';
 drawPreview();wireEditor();
}
function readFields(){E.name=$('pn').value.trim();E.description=$('pd').value.trim();E.price_cents=cents($('pp').value);E.upcharge_cents=cents($('pu').value||0);E.active=$('pa').checked;E.sold_out=$('pso').checked}
function wireEditor(){
 $('back').onclick=function(){E=null;draw()};
 $('pvc').onclick=function(e){var b=e.target.closest('button');if(b){pvColor=b.dataset.hex;drawPreview()}};
 $('blanks').onclick=function(e){var b=e.target.closest('button');if(!b)return;readFields();setBlank(b.dataset.b);drawEditor()};
 $('sws').onclick=function(e){var b=e.target.closest('button');if(!b)return;readFields();var h=b.dataset.h,i=E.colors.findIndex(function(c){return c.hex.toLowerCase()===h.toLowerCase()});
  if(i>=0){if(E.colors.length>1)E.colors.splice(i,1)}else E.colors.push({name:b.dataset.n,hex:h});if(!E.colors.some(function(c){return c.hex===pvColor}))pvColor=E.colors[0].hex;drawEditor()};
 $('cadd').onclick=function(){var n=$('cn').value.trim(),h=$('cc').value;if(!n){$('cn').focus();return}readFields();E.colors.push({name:n,hex:h});pvColor=h;drawEditor()};
 $('ladd').onclick=function(){readFields();var used=E.design.logos.map(function(l){return l.place}),pl=Object.keys(R.BLANKS[E.blank].places).find(function(k){return used.indexOf(k)<0})||Object.keys(R.BLANKS[E.blank].places)[0];
  E.design.logos.push({logo:'A',ink:'gold',place:pl,scale:1,dy:0});drawEditor()};
 var upFor=null;
 [].forEach.call(document.querySelectorAll('.lg'),function(box){var i=+box.dataset.i,l=E.design.logos[i];
  box.querySelector('.lsel').onchange=function(){if(this.value==='__up'){upFor=i;$('lfile').click();this.value=l.logo;return}l.logo=this.value;readFields();drawEditor()};
  box.querySelector('.lrm').onclick=function(){readFields();E.design.logos.splice(i,1);drawEditor()};
  box.querySelector('.lpl').onchange=function(){l.place=this.value;drawPreview()};
  box.querySelector('.lin').onclick=function(e){var b=e.target.closest('button');if(!b||b.disabled)return;l.ink=b.dataset.k;[].forEach.call(this.children,function(x){x.classList.toggle('on',x===b)});box.querySelector('.top img').src=R.logoSrc(l);drawPreview()};
  box.querySelector('.lsc').oninput=function(){l.scale=this.value/100;box.querySelector('.sv').textContent=this.value+'%';drawPreview()};
  box.querySelector('.ldy').oninput=function(){l.dy=+this.value;drawPreview()};
 });
 $('lfile').onchange=async function(){var f=this.files[0];this.value='';if(!f||upFor==null)return;msg('Uploading logo…');
  var u=await upload(f,'logos');if(!u)return;customLogos.unshift(u);readFields();E.design.logos[upFor].logo=u;msg('Logo uploaded.','ok');drawEditor()};
 $('szs').onclick=function(e){var b=e.target.closest('button');if(!b)return;var s=b.dataset.s,i=E.sizes.indexOf(s);if(i>=0)E.sizes.splice(i,1);else E.sizes.push(s);
  E.sizes.sort(function(a,b){return ALL_SIZES.indexOf(a)-ALL_SIZES.indexOf(b)});b.classList.toggle('on',i<0)};
 $('padd').onclick=function(){$('pfile').click()};
 $('pfile').onchange=async function(){var fs=[].slice.call(this.files);this.value='';readFields();for(var k=0;k<fs.length;k++){msg('Uploading photo '+(k+1)+' of '+fs.length+'…');var u=await upload(fs[k],'photos');if(u)E.photos.push(u)}msg('');drawEditor()};
 $('phs').onclick=function(e){var b=e.target.closest('button');if(!b)return;readFields();E.photos.splice(+b.dataset.i,1);drawEditor()};
 $('psave').onclick=saveP;
 if($('pdup'))$('pdup').onclick=function(){readFields();edit(E,true)};
 if($('pdel'))$('pdel').onclick=async function(){if(this.dataset.c!=='1'){this.dataset.c='1';this.textContent='Tap again to delete';return}
  var r=await sb.from('store_products').delete().eq('id',E.id);if(r.error){msg(r.error.message,'err');return}await loadP();E=null;draw()};
}
function msg(t,k){var m=$('pmsg');if(m){m.textContent=t;m.className='msg'+(k?' '+k:'')}}
async function upload(file,folder){if(file.size>8*1024*1024){msg('That file is over 8 MB.','err');return null}
 var ext=(file.name.split('.').pop()||'png').toLowerCase().replace(/[^a-z0-9]/g,'');var path=folder+'/'+Date.now()+'-'+Math.random().toString(36).slice(2,8)+'.'+ext;
 var r=await sb.storage.from('store').upload(path,file,{contentType:file.type,upsert:false});
 if(r.error){msg('Upload failed: '+r.error.message,'err');return null}return sb.storage.from('store').getPublicUrl(path).data.publicUrl}
async function saveP(){readFields();
 if(!E.name){msg('Give it a name.','err');$('pn').focus();return}
 if(E.price_cents<50){msg('Set a price.','err');$('pp').focus();return}
 if(!E.colors.length){msg('Pick at least one color.','err');return}
 if(!E.sizes.length){msg('Pick at least one size.','err');return}
 var row={name:E.name,description:E.description,blank:E.blank,colors:E.colors,sizes:E.sizes,price_cents:E.price_cents,upcharge_cents:E.upcharge_cents,design:E.design,photos:E.photos,active:E.active,sold_out:E.sold_out,updated_at:new Date().toISOString()};
 $('psave').disabled=true;msg('Saving…');
 var r=E.id?await sb.from('store_products').update(row).eq('id',E.id).select().single():await sb.from('store_products').insert(row).select().single();
 $('psave').disabled=false;if(r.error){msg('Did not save: '+r.error.message,'err');return}
 E.id=r.data.id;await loadP();msg(E.active?'Saved. It\'s live on the store.':'Saved as a draft.','ok');
 if(!$('pdel'))drawEditor(),msg(E.active?'Saved. It\'s live on the store.':'Saved as a draft.','ok');
}

/* ---------- orders ---------- */
function addr(o){var s=o.shipping||{},a=s.address||{};return [s.name||o.name,a.line1,a.line2,[a.city,a.state].filter(Boolean).join(', ')+(a.postal_code?' '+a.postal_code:'')].filter(Boolean).join('\n')}
function drawOrders(){
 var list=O.filter(function(o){return ofilter==='all'||o.status===ofilter});
 $('view').innerHTML='<div class="bar"><h2>Orders</h2><div class="seg" id="of">'+[['paid','To ship'],['shipped','Shipped'],['all','All']].map(function(x){return '<button data-f="'+x[0]+'" class="'+(ofilter===x[0]?'on':'')+'">'+x[1]+'</button>'}).join('')+'</div></div>'+
 (list.length?list.map(function(o){var n=(o.items||[]).reduce(function(a,i){return a+(i.qty||0)},0);
  return '<div class="oc" data-id="'+o.id+'"><div class="h"><div><div class="nm">'+esc(o.name||o.email||'Customer')+'</div><div class="sub">'+new Date(o.created_at).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})+' · '+n+' item'+(n===1?'':'s')+'</div></div><div style="text-align:right"><div class="nm">'+money(o.amount_cents)+'</div><span class="pill '+(o.status==='shipped'?'live':'so')+'">'+(o.status==='shipped'?'SHIPPED':'TO SHIP')+'</span></div></div>'+
  '<ul>'+(o.items||[]).map(function(i){return '<li>'+i.qty+' × '+esc(i.name)+' — '+esc(i.color)+' / '+esc(i.size)+'</li>'}).join('')+'</ul>'+
  '<div class="addr">'+esc(addr(o))+'</div><div class="sub">'+esc(o.email||'')+(o.phone?' · '+esc(o.phone):'')+'</div>'+
  (o.status==='shipped'?'<div class="sub">Tracking: '+esc(o.tracking||'—')+'</div>':'<div class="two" style="grid-template-columns:1fr auto"><input type="text" class="trk" placeholder="Tracking number (optional)"><button class="btn ship">MARK SHIPPED</button></div>')+
  '<div class="row" style="justify-content:flex-start"><button class="btn3 cpy">Copy address</button></div></div>'}).join('')
 :'<p class="empty">'+(ofilter==='paid'?'Nothing to ship right now.':'No orders yet.')+'</p>');
 $('of').onclick=function(e){var b=e.target.closest('button');if(b){ofilter=b.dataset.f;drawOrders()}};
 [].forEach.call(document.querySelectorAll('.oc'),function(c){var o=O.find(function(x){return x.id===c.dataset.id});
  c.querySelector('.cpy').onclick=function(){var b=this;try{navigator.clipboard.writeText(addr(o)).then(function(){b.textContent='Copied'})}catch(e){}};
  var s=c.querySelector('.ship');if(s)s.onclick=async function(){s.disabled=true;var t=c.querySelector('.trk').value.trim();
   var r=await sb.from('store_orders').update({status:'shipped',tracking:t||null,shipped_at:new Date().toISOString()}).eq('id',o.id);
   if(r.error){s.disabled=false;s.textContent='Try again';return}o.status='shipped';o.tracking=t;loadO();drawOrders()}});
}

/* ---------- settings ---------- */
function drawSettings(){
 $('view').innerHTML='<div class="bar"><h2>Settings</h2></div><div class="sec" style="max-width:520px"><h3>SHIPPING</h3><div style="display:grid;gap:12px">'+
 '<div class="f"><label for="ss">Flat shipping per order ($)</label><input type="number" id="ss" inputmode="decimal" min="0" step="0.01" value="'+((S.shipping_cents||0)/100).toFixed(2)+'"></div>'+
 '<div class="f"><label for="sf">Free shipping on orders over ($, 0 = never)</label><input type="number" id="sf" inputmode="decimal" min="0" step="0.01" value="'+((S.free_ship_over_cents||0)/100).toFixed(2)+'"></div>'+
 '<button class="btn" id="ssave">SAVE</button><div class="msg" id="smsg"></div></div></div>'+
 '<div class="sec" style="max-width:520px"><h3>PAYMENTS</h3><p style="margin:0;color:var(--mu)">Checkout runs through your Stripe account. Payouts, refunds and receipts are handled in your Stripe dashboard.</p></div>';
 $('ssave').onclick=async function(){var row={shipping_cents:cents($('ss').value),free_ship_over_cents:cents($('sf').value),updated_at:new Date().toISOString()};
  var r=await sb.from('store_settings').update(row).eq('id',1);var m=$('smsg');if(r.error){m.textContent=r.error.message;m.className='msg err';return}S=Object.assign(S,row);m.textContent='Saved.';m.className='msg ok'};
}
start();
})();
</script>
</body></html>
